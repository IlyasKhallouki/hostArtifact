# Exact permissions by operation; candidate roles require administrator review.
bootstrap:
  serviceusage.services.enable: roles/serviceusage.serviceUsageAdmin
  serviceusage.services.list: roles/serviceusage.serviceUsageViewer
  artifactregistry.repositories.create: roles/artifactregistry.admin
  artifactregistry.repositories.get: roles/artifactregistry.reader
  artifactregistry.repositories.getIamPolicy: roles/artifactregistry.admin
  artifactregistry.repositories.setIamPolicy: roles/artifactregistry.admin
  datastore.databases.create: roles/datastore.owner
  datastore.databases.getMetadata: roles/datastore.viewer
  storage.buckets.create: roles/storage.admin
  storage.buckets.get: roles/storage.admin
  storage.buckets.setIamPolicy: roles/storage.admin
  iam.serviceAccounts.create: roles/iam.serviceAccountAdmin
  iam.serviceAccounts.get: roles/iam.serviceAccountViewer
  resourcemanager.projects.getIamPolicy: roles/resourcemanager.projectIamAdmin
  resourcemanager.projects.setIamPolicy: roles/resourcemanager.projectIamAdmin
  secretmanager.secrets.create: roles/secretmanager.admin
  secretmanager.secrets.get: roles/secretmanager.viewer
  secretmanager.secrets.setIamPolicy: roles/secretmanager.admin
  secretmanager.versions.add: roles/secretmanager.secretVersionAdder
deploy:
  serviceusage.services.list: roles/serviceusage.serviceUsageViewer
  run.services.create: roles/run.developer
  run.services.get: roles/run.viewer
  run.services.update: roles/run.developer
  run.services.getIamPolicy: roles/run.admin
  run.services.setIamPolicy: roles/run.admin
  cloudbuild.builds.create: roles/cloudbuild.builds.editor
  cloudbuild.builds.get: roles/cloudbuild.builds.viewer
  artifactregistry.repositories.get: roles/artifactregistry.reader
  artifactregistry.dockerimages.get: roles/artifactregistry.reader
  secretmanager.versions.list: roles/secretmanager.viewer
domains:
  serviceusage.services.list: roles/serviceusage.serviceUsageViewer
  run.services.get: roles/run.viewer
  datastore.entities.get: roles/datastore.viewer
  datastore.entities.list: roles/datastore.viewer
  datastore.entities.create: roles/datastore.user
  datastore.entities.update: roles/datastore.user
  compute.networkEndpointGroups.create: roles/compute.networkAdmin
  compute.networkEndpointGroups.get: roles/compute.networkViewer
  compute.networkEndpointGroups.use: roles/compute.networkAdmin
  compute.backendServices.create: roles/compute.loadBalancerAdmin
  compute.backendServices.get: roles/compute.loadBalancerAdmin
  compute.backendServices.update: roles/compute.loadBalancerAdmin
  compute.backendServices.use: roles/compute.loadBalancerAdmin
  compute.urlMaps.create: roles/compute.loadBalancerAdmin
  compute.urlMaps.get: roles/compute.loadBalancerAdmin
  compute.urlMaps.use: roles/compute.loadBalancerAdmin
  compute.targetHttpsProxies.create: roles/compute.loadBalancerAdmin
  compute.targetHttpsProxies.get: roles/compute.loadBalancerAdmin
  compute.targetHttpsProxies.use: roles/compute.loadBalancerAdmin
  compute.globalForwardingRules.create: roles/compute.loadBalancerAdmin
  compute.globalForwardingRules.get: roles/compute.loadBalancerAdmin
  compute.globalAddresses.create: roles/compute.networkAdmin
  compute.globalAddresses.get: roles/compute.networkViewer
  compute.globalAddresses.use: roles/compute.networkAdmin
  certificatemanager.certs.create: roles/certificatemanager.editor
  certificatemanager.certs.get: roles/certificatemanager.viewer
  certificatemanager.certs.use: roles/certificatemanager.editor
  certificatemanager.dnsauthorizations.create: roles/certificatemanager.editor
  certificatemanager.dnsauthorizations.get: roles/certificatemanager.viewer
  certificatemanager.dnsauthorizations.use: roles/certificatemanager.editor
  certificatemanager.certmaps.create: roles/certificatemanager.editor
  certificatemanager.certmaps.get: roles/certificatemanager.viewer
  certificatemanager.certmaps.use: roles/certificatemanager.editor
  certificatemanager.certmapentries.create: roles/certificatemanager.editor
  certificatemanager.certmapentries.get: roles/certificatemanager.viewer
  certificatemanager.certmapentries.list: roles/certificatemanager.viewer
domain-mapping:
  serviceusage.services.list: roles/serviceusage.serviceUsageViewer
  run.domainmappings.create: roles/run.admin
  run.domainmappings.get: roles/run.viewer
  run.services.get: roles/run.viewer
  datastore.entities.get: roles/datastore.viewer
  datastore.entities.list: roles/datastore.viewer
  datastore.entities.create: roles/datastore.user
  datastore.entities.update: roles/datastore.user
discover:
  serviceusage.services.list: roles/serviceusage.serviceUsageViewer
  run.locations.list: roles/run.viewer
  run.domainmappings.list: roles/run.viewer
  dns.managedZones.list: roles/dns.reader
  compute.urlMaps.list: roles/compute.viewer
  compute.sslCertificates.list: roles/compute.viewer
  certificatemanager.certs.list: roles/certificatemanager.viewer
  certificatemanager.dnsauthorizations.list: roles/certificatemanager.viewer
  certificatemanager.certmaps.list: roles/certificatemanager.viewer
  certificatemanager.certmapentries.list: roles/certificatemanager.viewer
registry:
  serviceusage.services.list: roles/serviceusage.serviceUsageViewer
  datastore.entities.get: roles/datastore.viewer
  datastore.entities.list: roles/datastore.viewer
  datastore.entities.create: roles/datastore.user
  datastore.entities.update: roles/datastore.user
domain-status:
  serviceusage.services.list: roles/serviceusage.serviceUsageViewer
  datastore.entities.get: roles/datastore.viewer
  datastore.entities.list: roles/datastore.viewer
  datastore.entities.create: roles/datastore.user
  datastore.entities.update: roles/datastore.user
  certificatemanager.certs.get: roles/certificatemanager.viewer
domain-mapping-status:
  serviceusage.services.list: roles/serviceusage.serviceUsageViewer
  datastore.entities.get: roles/datastore.viewer
  datastore.entities.list: roles/datastore.viewer
  datastore.entities.create: roles/datastore.user
  datastore.entities.update: roles/datastore.user
  run.domainmappings.get: roles/run.viewer
