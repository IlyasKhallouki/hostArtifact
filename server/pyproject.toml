[project]
name = "artifact-publisher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.1.0",
    "py-key-value-aio[firestore]",
    "google-cloud-firestore",
    "google-cloud-storage",
    "argon2-cffi",
    "itsdangerous",
    "pydantic-settings",
    "uvicorn",
    "httpx",
    "pyyaml",
    "tldextract",
    "python-multipart",
]

[project.scripts]
publisher-admin = "publisher.admin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/publisher"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
